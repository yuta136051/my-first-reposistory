name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          cp shooting-game/index.html /tmp/game_index.html

          if git ls-remote --exit-code origin gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          git rm -rf --cached . 2>/dev/null || true

          cp /tmp/game_index.html index.html
          touch .nojekyll

          git add index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Deploy from main @ ${{ github.sha }}"
            git push origin gh-pages --force
          else
            echo "No changes to deploy"
          fi
