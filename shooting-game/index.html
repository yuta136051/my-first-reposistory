<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シューティングゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      color: white;
    }
    h1 { margin-bottom: 10px; font-size: 1.5rem; color: #00ffcc; }
    #gameCanvas {
      border: 2px solid #00ffcc;
      box-shadow: 0 0 20px #00ffcc44;
      display: block;
    }
    #ui {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      color: white;
      font-size: 1.5rem;
      text-align: center;
      padding: 20px;
      border-radius: 8px;
    }
    #overlay button {
      margin-top: 16px;
      padding: 10px 30px;
      font-size: 1rem;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #overlay button:hover { background: #00ddaa; }
    #wrapper {
      position: relative;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>★ シューティングゲーム ★</h1>
  <div id="wrapper">
    <canvas id="gameCanvas" width="480" height="600"></canvas>
    <div id="overlay">
      <div>スペースキー or タップで開始</div>
      <button id="startBtn">スタート</button>
    </div>
  </div>
  <div id="ui">
    移動: ← → キー &nbsp;|&nbsp; 射撃: スペース &nbsp;|&nbsp; スマホ: 画面タップ&ドラッグ
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');

    const W = canvas.width, H = canvas.height;
    let state = 'idle'; // idle, playing, gameover
    let score, lives, level, frameCount;
    let player, bullets, enemies, enemyBullets, stars, particles;
    let keys = {};
    let touchX = null;

    function init() {
      score = 0; lives = 3; level = 1; frameCount = 0;
      player = { x: W/2, y: H - 60, w: 36, h: 36, speed: 5, cooldown: 0 };
      bullets = []; enemies = []; enemyBullets = []; particles = [];
      stars = Array.from({length: 80}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        speed: 0.5 + Math.random()*1.5, size: Math.random()*2
      }));
      spawnWave();
    }

    function spawnWave() {
      const cols = 6, rows = 2 + Math.min(level, 3);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: 50 + c * 65, y: 40 + r * 50,
            w: 32, h: 28,
            hp: 1 + Math.floor(level/3),
            dx: (level % 2 === 0 ? -1 : 1) * (0.8 + level*0.15),
            dy: 0, shootTimer: Math.random()*120,
            type: r % 3
          });
        }
      }
    }

    function spawnParticles(x, y, color, count=10) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
          life: 1, color
        });
      }
    }

    function drawPlayer(x, y) {
      ctx.save();
      ctx.translate(x, y);
      // 本体
      ctx.fillStyle = '#00ffcc';
      ctx.beginPath();
      ctx.moveTo(0, -18); ctx.lineTo(14, 12); ctx.lineTo(-14, 12);
      ctx.closePath(); ctx.fill();
      // エンジン炎
      ctx.fillStyle = frameCount % 6 < 3 ? '#ff6600' : '#ffcc00';
      ctx.beginPath();
      ctx.moveTo(-8, 12); ctx.lineTo(0, 22 + Math.random()*6); ctx.lineTo(8, 12);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function drawEnemy(e) {
      const colors = ['#ff4466', '#ff9900', '#cc44ff'];
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = colors[e.type];
      if (e.type === 0) {
        // 丸型
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff3'; ctx.beginPath(); ctx.arc(-4, -4, 5, 0, Math.PI*2); ctx.fill();
      } else if (e.type === 1) {
        // 四角型
        ctx.fillRect(-14, -12, 28, 24);
        ctx.fillStyle = '#fff3'; ctx.fillRect(-8, -6, 8, 8);
      } else {
        // 菱形
        ctx.beginPath();
        ctx.moveTo(0,-14); ctx.lineTo(14,0); ctx.lineTo(0,14); ctx.lineTo(-14,0);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    function update() {
      frameCount++;

      // 星スクロール
      stars.forEach(s => { s.y += s.speed; if (s.y > H) s.y = 0; });

      // プレイヤー移動
      if (keys['ArrowLeft'] || keys['a'])  player.x = Math.max(player.w/2, player.x - player.speed);
      if (keys['ArrowRight'] || keys['d']) player.x = Math.min(W - player.w/2, player.x + player.speed);
      if (touchX !== null) {
        const dx = touchX - player.x;
        player.x += dx * 0.12;
      }
      player.cooldown = Math.max(0, player.cooldown - 1);

      // 射撃
      if ((keys[' '] || keys['z']) && player.cooldown === 0) {
        bullets.push({ x: player.x, y: player.y - 20, speed: 10 });
        player.cooldown = 12;
      }

      // 弾移動
      bullets = bullets.filter(b => { b.y -= b.speed; return b.y > 0; });
      enemyBullets = enemyBullets.filter(b => { b.y += b.speed; return b.y < H; });

      // 敵移動 & 射撃
      let hitWall = false;
      enemies.forEach(e => {
        e.x += e.dx;
        if (e.x < 20 || e.x > W - 20) hitWall = true;
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          enemyBullets.push({ x: e.x, y: e.y + 16, speed: 3 + level*0.3 });
          e.shootTimer = 60 + Math.random()*60 - level*5;
        }
      });
      if (hitWall) enemies.forEach(e => { e.dx *= -1; e.y += 12; });

      // 衝突：自弾 vs 敵
      bullets = bullets.filter(b => {
        let hit = false;
        enemies = enemies.filter(e => {
          if (Math.abs(b.x - e.x) < 18 && Math.abs(b.y - e.y) < 18) {
            e.hp--;
            if (e.hp <= 0) {
              spawnParticles(e.x, e.y, ['#ff4466','#ff9900','#cc44ff'][e.type], 14);
              score += 100 * level;
              hit = true;
              return false;
            }
            hit = true;
          }
          return true;
        });
        return !hit;
      });

      // 衝突：敵弾 vs プレイヤー
      enemyBullets = enemyBullets.filter(b => {
        if (Math.abs(b.x - player.x) < 18 && Math.abs(b.y - player.y) < 20) {
          lives--;
          spawnParticles(player.x, player.y, '#00ffcc', 20);
          if (lives <= 0) { state = 'gameover'; showOverlay('ゲームオーバー', `スコア: ${score}`); }
          return false;
        }
        return true;
      });

      // 全滅 → 次のウェーブ
      if (enemies.length === 0) { level++; spawnWave(); }

      // パーティクル
      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        return p.life > 0;
      });
    }

    function draw() {
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(0, 0, W, H);

      // 星
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size*0.3})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // パーティクル
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x-2, p.y-2, 4, 4);
      });
      ctx.globalAlpha = 1;

      // 敵
      enemies.forEach(drawEnemy);

      // 弾
      ctx.fillStyle = '#ffff44';
      bullets.forEach(b => { ctx.fillRect(b.x-2, b.y-8, 4, 10); });
      ctx.fillStyle = '#ff4488';
      enemyBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

      // プレイヤー
      drawPlayer(player.x, player.y);

      // UI
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 16px Arial';
      ctx.fillText(`スコア: ${score}`, 10, 24);
      ctx.fillText(`レベル: ${level}`, W/2 - 40, 24);
      ctx.fillStyle = '#ff4466';
      ctx.fillText('♥'.repeat(lives), W - 20 - lives*18, 24);
    }

    function loop() {
      if (state === 'playing') { update(); draw(); }
      requestAnimationFrame(loop);
    }

    function showOverlay(title, sub='') {
      overlay.innerHTML = `<div style="font-size:1.8rem;color:#00ffcc">${title}</div>
        <div style="margin:8px;font-size:1.1rem">${sub}</div>
        <button id="startBtn">もう一度</button>`;
      overlay.style.display = 'flex';
      document.getElementById('startBtn').addEventListener('click', startGame);
    }

    function startGame() {
      overlay.style.display = 'none';
      init();
      state = 'playing';
    }

    startBtn.addEventListener('click', startGame);

    // キーボード
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') { e.preventDefault(); if (state === 'idle' || state === 'gameover') startGame(); }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    // タッチ操作
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (state !== 'playing') { startGame(); return; }
      touchX = e.touches[0].clientRect ? e.touches[0].clientX : e.touches[0].pageX - canvas.getBoundingClientRect().left;
      // タップで射撃
      if (player.cooldown === 0) { bullets.push({x: player.x, y: player.y-20, speed:10}); player.cooldown=12; }
    }, {passive: false});
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      touchX = e.touches[0].pageX - canvas.getBoundingClientRect().left;
    }, {passive: false});
    canvas.addEventListener('touchend', () => touchX = null);

    loop();
  </script>
</body>
</html>
