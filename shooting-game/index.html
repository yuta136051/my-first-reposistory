<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シューティングゲーム</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      color: white;
    }
    h1 { margin-bottom: 10px; font-size: 1.5rem; color: #00ffcc; }
    #gameCanvas { border: 2px solid #00ffcc; box-shadow: 0 0 20px #00ffcc44; display: block; }
    #ui { margin-top: 10px; font-size: 0.85rem; color: #aaa; text-align: center; }
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      color: white;
      font-size: 1.5rem;
      text-align: center;
      padding: 20px;
      border-radius: 8px;
    }
    #overlay button {
      margin-top: 16px; padding: 10px 30px; font-size: 1rem;
      background: #00ffcc; color: #000; border: none; border-radius: 6px;
      cursor: pointer; font-weight: bold;
    }
    #overlay button:hover { background: #00ddaa; }
    #wrapper { position: relative; display: inline-block; }
  </style>
</head>
<body>
  <h1>★ シューティングゲーム ★</h1>
  <div id="wrapper">
    <canvas id="gameCanvas" width="480" height="600"></canvas>
    <div id="overlay">
      <div>スペースキー or タップで開始</div>
      <button id="startBtn">スタート</button>
    </div>
  </div>
  <div id="ui">移動: ← → キー &nbsp;|&nbsp; 射撃: スペース &nbsp;|&nbsp; スマホ: タップ&ドラッグ</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const W = canvas.width, H = canvas.height;

    let state = 'idle';
    let score, lives, level, frameCount, waveDelay;
    let player, bullets, enemies, enemyBullets, stars, particles, powerups;
    let boss, bossWarning, shake;
    let keys = {}, touchX = null;
    let highScore = parseInt(localStorage.getItem('shmupHi') || '0');

    const PU_COLORS = { multi: '#ffff00', shield: '#00aaff', speed: '#ff8800' };
    const PU_LABELS = { multi: 'W', shield: 'S', speed: 'P' };
    const PU_TYPES  = ['multi', 'shield', 'speed'];

    function init() {
      score = 0; lives = 3; level = 1; frameCount = 0;
      waveDelay = 0; bossWarning = 0; boss = null; shake = 0;
      player = { x: W/2, y: H-60, w: 36, h: 36, speed: 5, cooldown: 0,
                 invincible: 0, multiShot: 0, speedBoost: 0, shield: false };
      bullets = []; enemies = []; enemyBullets = []; particles = []; powerups = [];
      stars = Array.from({length: 80}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        speed: 0.5 + Math.random()*1.5, size: Math.random()*2
      }));
      spawnWave();
    }

    function spawnWave() {
      enemyBullets = [];
      if (level % 3 === 0) { bossWarning = 120; return; }
      const cols = 6, rows = 2 + Math.min(level, 4);
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          enemies.push({
            x: 50 + c*65, y: 40 + r*50, w: 32, h: 28,
            hp: 1 + Math.floor(level/3),
            dx: (level%2===0 ? -1 : 1) * (0.8 + level*0.15),
            shootTimer: Math.random()*120, type: r%3,
            diver: level > 2 && Math.random() < 0.15, _diving: false
          });
    }

    function spawnBoss() {
      boss = {
        x: W/2, y: 80, w: 64, h: 56,
        hp: 20 + level*5, maxHp: 20 + level*5,
        dx: 1.5 + level*0.1, angle: 0,
        shootTimer: 60, flashTimer: 0
      };
    }

    function spawnParticles(x, y, color, n=10) {
      for (let i = 0; i < n; i++) {
        const a = Math.random()*Math.PI*2, s = 1 + Math.random()*3;
        particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
                         life: 1, color, size: 2 + Math.random()*3 });
      }
    }

    function dropPowerup(x, y, force=false) {
      if (!force && Math.random() > 0.25) return;
      const t = PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
      powerups.push({ x, y, type: t, color: PU_COLORS[t], label: PU_LABELS[t], vy: 1.5, life: 360 });
    }

    function applyPowerup(type) {
      if (type === 'multi') player.multiShot = 600;
      else if (type === 'shield') player.shield = true;
      else if (type === 'speed') player.speedBoost = 400;
      spawnParticles(player.x, player.y, PU_COLORS[type], 15);
    }

    function drawPlayer(x, y) {
      if (player.invincible > 0 && Math.floor(frameCount/4) % 2 === 0) return;
      ctx.save(); ctx.translate(x, y);
      if (player.shield) {
        ctx.strokeStyle = '#00aaff'; ctx.lineWidth = 3;
        ctx.globalAlpha = 0.5 + 0.3*Math.sin(frameCount*0.1);
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = frameCount%6 < 3 ? '#ff6600' : '#ffcc00';
      ctx.beginPath(); ctx.moveTo(-8,12); ctx.lineTo(0, 22+Math.random()*6); ctx.lineTo(8,12); ctx.closePath(); ctx.fill();
      ctx.fillStyle = player.speedBoost > 0 ? '#ffcc44' : '#00ffcc';
      ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(14,12); ctx.lineTo(-14,12); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function drawEnemy(e) {
      const colors = ['#ff4466','#ff9900','#cc44ff'];
      ctx.save(); ctx.translate(e.x, e.y);
      if (e._diving) ctx.globalAlpha = 0.7 + 0.3*Math.sin(frameCount*0.3);
      ctx.fillStyle = colors[e.type];
      if (e.type === 0) {
        ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff3'; ctx.beginPath(); ctx.arc(-4,-4,5,0,Math.PI*2); ctx.fill();
      } else if (e.type === 1) {
        ctx.fillRect(-14,-12,28,24);
        ctx.fillStyle = '#fff3'; ctx.fillRect(-8,-6,8,8);
      } else {
        ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(14,0); ctx.lineTo(0,14); ctx.lineTo(-14,0); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.restore();
    }

    function drawBoss() {
      if (!boss) return;
      ctx.save(); ctx.translate(boss.x, boss.y);
      ctx.fillStyle = boss.flashTimer > 0 ? '#ffffff' : `hsl(${frameCount*3%360},80%,55%)`;
      ctx.beginPath();
      ctx.moveTo(0,-28); ctx.lineTo(32,-10); ctx.lineTo(32,20);
      ctx.lineTo(0,28); ctx.lineTo(-32,20); ctx.lineTo(-32,-10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(0,-5,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(3,-5,5,0,Math.PI*2); ctx.fill();
      ctx.restore();
      const bw=200, bh=10, bx=W/2-100, by=8;
      ctx.fillStyle = '#333'; ctx.fillRect(bx,by,bw,bh);
      const pct = boss.hp/boss.maxHp;
      ctx.fillStyle = pct > 0.5 ? '#00ff88' : pct > 0.25 ? '#ffaa00' : '#ff4444';
      ctx.fillRect(bx, by, bw*pct, bh);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(bx,by,bw,bh);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px Arial'; ctx.textAlign = 'center';
      ctx.fillText('BOSS', W/2, by+8); ctx.textAlign = 'left';
    }

    function shoot() {
      bullets.push({x: player.x, y: player.y-20, vx: 0, vy: -10});
      if (player.multiShot > 0) {
        bullets.push({x: player.x, y: player.y-20, vx: -2.5, vy: -9.6});
        bullets.push({x: player.x, y: player.y-20, vx:  2.5, vy: -9.6});
      }
      player.cooldown = 12;
    }

    function update() {
      frameCount++;
      if (shake > 0) shake--;
      stars.forEach(s => { s.y += s.speed; if (s.y > H) s.y = 0; });

      if (bossWarning > 0) { bossWarning--; if (bossWarning === 0) spawnBoss(); return; }
      if (waveDelay > 0)   { waveDelay--;   if (waveDelay === 0)   spawnWave();  return; }

      const spd = player.speed + (player.speedBoost > 0 ? 2 : 0);
      if (keys['ArrowLeft']  || keys['a']) player.x = Math.max(player.w/2,   player.x - spd);
      if (keys['ArrowRight'] || keys['d']) player.x = Math.min(W-player.w/2, player.x + spd);
      if (touchX !== null) player.x += (touchX - player.x) * 0.12;
      if (player.invincible > 0) player.invincible--;
      if (player.multiShot  > 0) player.multiShot--;
      if (player.speedBoost > 0) player.speedBoost--;
      player.cooldown = Math.max(0, player.cooldown - 1);

      if ((keys[' '] || keys['z'] || touchX !== null) && player.cooldown === 0) shoot();

      bullets = bullets.filter(b => { b.x += b.vx; b.y += b.vy; return b.y > -10 && b.x > -10 && b.x < W+10; });
      enemyBullets = enemyBullets.filter(b => { b.x += b.vx; b.y += b.vy; return b.y < H+10 && b.y > -10 && b.x > -10 && b.x < W+10; });

      let hitWall = false;
      enemies.forEach(e => {
        if (e.diver) {
          if (!e._diving && Math.random() < 0.003) e._diving = true;
          if (e._diving) {
            const dx = player.x-e.x, dy = player.y-e.y, d = Math.sqrt(dx*dx+dy*dy)||1;
            e.x += dx/d*2.5; e.y += dy/d*2.5;
            if (e.y > H+20) { e.y = -20; e._diving = false; }
            return;
          }
        }
        e.x += e.dx;
        if (e.x < 20 || e.x > W-20) hitWall = true;
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          enemyBullets.push({x: e.x, y: e.y+16, vx: 0, vy: 3+level*0.3});
          e.shootTimer = Math.max(20, 60+Math.random()*60-level*5);
        }
      });
      if (hitWall) enemies.forEach(e => { if (!e._diving) { e.dx *= -1; e.y += 12; } });

      if (boss) {
        boss.angle += 0.02;
        boss.x += boss.dx + Math.sin(boss.angle*2)*1.5;
        if (boss.x < 48 || boss.x > W-48) boss.dx *= -1;
        if (boss.flashTimer > 0) boss.flashTimer--;
        boss.shootTimer--;
        if (boss.shootTimer <= 0) {
          const bs = 3.5 + level*0.2;
          for (let i = -1; i <= 1; i++) enemyBullets.push({x: boss.x+i*12, y: boss.y+30, vx: i*2, vy: bs});
          if (frameCount % 160 < 5) {
            const dx = player.x-boss.x, dy = player.y-boss.y, d = Math.sqrt(dx*dx+dy*dy)||1;
            enemyBullets.push({x: boss.x, y: boss.y+30, vx: dx/d*6, vy: dy/d*6});
          }
          boss.shootTimer = Math.max(20, 50-level*3);
        }
        bullets = bullets.filter(b => {
          if (Math.abs(b.x-boss.x) < 38 && Math.abs(b.y-boss.y) < 34) {
            boss.hp--; boss.flashTimer = 4;
            spawnParticles(b.x, b.y, '#ffffff', 3);
            if (boss.hp <= 0) {
              spawnParticles(boss.x, boss.y, '#ffaa00', 50);
              score += 1000 * level;
              dropPowerup(boss.x, boss.y, true);
              dropPowerup(boss.x+40, boss.y, true);
              boss = null; level++; waveDelay = 120;
            }
            return false;
          }
          return true;
        });
      }

      bullets = bullets.filter(b => {
        let hit = false;
        enemies = enemies.filter(e => {
          if (Math.abs(b.x-e.x) < 18 && Math.abs(b.y-e.y) < 18) {
            e.hp--;
            const c = ['#ff4466','#ff9900','#cc44ff'][e.type];
            spawnParticles(b.x, b.y, c, 3);
            if (e.hp <= 0) { spawnParticles(e.x, e.y, c, 12); score += 100*level; dropPowerup(e.x, e.y); hit = true; return false; }
            hit = true;
          }
          return true;
        });
        return !hit;
      });

      if (player.invincible === 0) {
        enemyBullets = enemyBullets.filter(b => {
          if (Math.abs(b.x-player.x) < 18 && Math.abs(b.y-player.y) < 20) {
            if (player.shield) { player.shield = false; spawnParticles(player.x, player.y, '#00aaff', 20); shake = 15; return false; }
            lives--; player.invincible = 120; shake = 30;
            spawnParticles(player.x, player.y, '#00ffcc', 20);
            if (lives <= 0) {
              if (score > highScore) { highScore = score; localStorage.setItem('shmupHi', highScore); }
              state = 'gameover';
              showOverlay('ゲームオーバー', `スコア: ${score.toLocaleString()}\nハイスコア: ${highScore.toLocaleString()}`);
            }
            return false;
          }
          return true;
        });
      }
      if (state !== 'playing') return;

      powerups = powerups.filter(p => {
        p.y += p.vy; p.life--;
        if (Math.abs(p.x-player.x) < 22 && Math.abs(p.y-player.y) < 22) { applyPowerup(p.type); return false; }
        return p.y < H && p.life > 0;
      });

      if (enemies.length === 0 && !boss && bossWarning === 0 && waveDelay === 0) { level++; waveDelay = 60; }

      particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; return p.life > 0; });
    }

    function draw() {
      const sx = shake > 0 ? (Math.random()-0.5)*8 : 0;
      const sy = shake > 0 ? (Math.random()-0.5)*8 : 0;
      ctx.save(); ctx.translate(sx, sy);
      ctx.fillStyle = '#0a0a1a'; ctx.fillRect(-10,-10,W+20,H+20);

      stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${0.3+s.size*0.3})`; ctx.fillRect(s.x,s.y,s.size,s.size); });

      if (bossWarning > 0) {
        ctx.fillStyle = `rgba(255,0,0,${0.2+0.2*Math.sin(frameCount*0.3)})`; ctx.fillRect(0,0,W,H);
        ctx.fillStyle = '#ff4444'; ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center';
        ctx.fillText('⚠ BOSS INCOMING ⚠', W/2, H/2-10);
        ctx.fillStyle = '#ffaaaa'; ctx.font = '22px Arial';
        ctx.fillText('準備して!', W/2, H/2+30); ctx.textAlign = 'left';
      }

      particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); });
      ctx.globalAlpha = 1;

      enemies.forEach(drawEnemy);
      drawBoss();

      ctx.fillStyle = '#ffff44';
      bullets.forEach(b => {
        ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vx,-b.vy));
        ctx.fillRect(-2,-8,4,10); ctx.restore();
      });
      ctx.fillStyle = '#ff4488';
      enemyBullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill(); });

      powerups.forEach(p => {
        ctx.save(); ctx.translate(p.x,p.y);
        ctx.globalAlpha = p.life < 60 ? p.life/60 : 1;
        ctx.shadowColor = p.color; ctx.shadowBlur = 12;
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#000'; ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'center'; ctx.fillText(p.label,0,4); ctx.textAlign = 'left';
        ctx.globalAlpha = 1; ctx.restore();
      });

      drawPlayer(player.x, player.y);

      ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 16px Arial';
      ctx.fillText(`スコア: ${score.toLocaleString()}`, 10, 24);
      ctx.fillText(`Lv.${level}`, W/2-20, 24);
      ctx.fillStyle = '#888'; ctx.font = '11px Arial';
      ctx.fillText(`BEST: ${highScore.toLocaleString()}`, 10, 40);
      ctx.fillStyle = '#ff4466'; ctx.font = 'bold 16px Arial';
      for (let i = 0; i < lives; i++) ctx.fillText('♥', W-22-(lives-i)*18, 24);

      let puy = 58;
      if (player.multiShot  > 0) { ctx.fillStyle='#ffff00'; ctx.font='11px Arial'; ctx.fillText(`W: ${Math.ceil(player.multiShot/60)}s`,  W-52, puy); puy+=15; }
      if (player.shield)         { ctx.fillStyle='#00aaff'; ctx.font='11px Arial'; ctx.fillText('S: ON', W-52, puy); puy+=15; }
      if (player.speedBoost > 0) { ctx.fillStyle='#ff8800'; ctx.font='11px Arial'; ctx.fillText(`P: ${Math.ceil(player.speedBoost/60)}s`, W-52, puy); }

      ctx.restore();
    }

    function loop() { if (state === 'playing') { update(); draw(); } requestAnimationFrame(loop); }

    function showOverlay(title, sub='') {
      overlay.innerHTML = `<div style="font-size:1.8rem;color:#00ffcc">${title}</div>
        <div style="margin:8px;font-size:1.1rem;white-space:pre-line">${sub}</div>
        <button id="startBtn">もう一度</button>`;
      overlay.style.display = 'flex';
      document.getElementById('startBtn').addEventListener('click', startGame);
    }

    function startGame() { overlay.style.display = 'none'; init(); state = 'playing'; }

    startBtn.addEventListener('click', startGame);
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === ' ') { e.preventDefault(); if (state === 'idle' || state === 'gameover') startGame(); }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (state !== 'playing') { startGame(); return; }
      touchX = e.touches[0].pageX - canvas.getBoundingClientRect().left;
      if (player.cooldown === 0) shoot();
    }, {passive: false});
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      touchX = e.touches[0].pageX - canvas.getBoundingClientRect().left;
    }, {passive: false});
    canvas.addEventListener('touchend', () => touchX = null);

    loop();
  </script>
</body>
</html>
